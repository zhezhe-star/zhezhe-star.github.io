# checklist.yaml — 个人博客 Orca 任务清单
#
# 规则：
# - 只追加，不改删旧任务。新工作追加新条目；废弃的任务把 status 改为 archived 并注明原因。
# - 状态机：pending → in_progress → complete / failed / archived
#   - failed / archived 是终态；failed 之后若要重试，追加一条新任务并在 note 里引用旧 id。
# - 每条任务的 acceptance 必须是可执行的验收标准（命令/测试/可观察结果），不许写“工作正常”这类空话。
# - evidence 指向 run-log.md 中的条目（用时间戳引用），任务标 complete 前必须填。
# - 压缩/重启后本文件与 plan.md、run-log.md 一起必读。
# - 可选字段：
#   risk: low|normal|high   -> high 任务执行前触发决策节点 3
#   depends_on: [T001]      -> 依赖任务，未完成时不得开始
#   verify: "<命令>"        -> 本任务最快能暴露问题的验证命令（全量套件在里程碑处跑）
#   owner_gate: true        -> 依赖老板决策或验收，未确认前不得继续实施

